name: Check desktop
on: [push, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run check
      - run: bun test tests
      - run: bun run probe:omp
      - run: bun run probe:runtime
      - run: bun run probe:controls
      - run: bun run probe:memory
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: bro-${{ matrix.os }}
          path: out/**/*.zip
