name: Check desktop
on: [push, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run check
      # These include real filesystem/SQLite integration tests, not just pure units.
      - run: bun test tests --timeout 15000
      - run: bun run probe:omp
      - run: bun run probe:runtime
      - name: Verify runtime controls three times
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Control probe ${attempt}/3"
            bun run probe:controls
          done
      - run: bun run probe:titles
      - run: bun run probe:memory
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: bro-${{ matrix.os }}
          path: out/**/*.zip
